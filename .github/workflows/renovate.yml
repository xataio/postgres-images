name: Renovate

on:
  schedule:
    - cron: '0 5 * * *' # Every day at 5 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what Renovate would do, without pushing branches or opening PRs'
        required: false
        default: false
        type: boolean

# One run at a time, so two runs never push to the same Renovate branch.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Renovate's repository cache. This is the directory the action's container
  # uses, so do not move it with cacheDir.
  CACHE_DIR: /tmp/renovate/cache/renovate/repository
  CACHE_KEY: renovate-cache

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore Renovate cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-

      # The restored files belong to the runner user, but Renovate reads them
      # inside its container as user 12021.
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          configurationFile: .github/renovate/config.js
          # Must be a token that can push branches and open PRs. PRs opened with
          # the default GITHUB_TOKEN do not start the build workflow.
          token: ${{ secrets.GIT_TOKEN }}
          renovate-version: 44.131.2
        env:
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: debug

      - name: Save Renovate cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

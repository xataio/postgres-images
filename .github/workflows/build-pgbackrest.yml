name: Build pgBackRest .deb package

on:
  workflow_dispatch:
    inputs:
      pgbackrest_commit:
        description: 'pgBackRest commit SHA to build'
        required: true
        default: '1d217e626301118ae2c1e7be39a6a4affa86e501'
        type: string
      pgbackrest_version:
        description: 'Version label for the package (e.g., 2.60.0dev)'
        required: true
        default: '2.60.0dev'
        type: string

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: xataio/postgres-images/pgbackrest-pkg
  # Builder base. The pgBackRest binary is PG-major agnostic, so one base is fine.
  CNPG_BASE: ghcr.io/cloudnative-pg/postgresql:17-minimal-bookworm

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
      PGBACKREST_COMMIT: ${{ inputs.pgbackrest_commit }}
      PGBACKREST_VERSION: ${{ inputs.pgbackrest_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push package image
        run: |
          IMAGE_TAG="${REGISTRY}/${PACKAGE_NAME}:${PGBACKREST_VERSION}-${ARCH}"

          echo "Building pgBackRest package using base: ${CNPG_BASE}"
          echo "Commit: ${PGBACKREST_COMMIT}"
          echo "Image tag: ${IMAGE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            --build-arg CNPG_BASE="${CNPG_BASE}" \
            --build-arg PGBACKREST_COMMIT="${PGBACKREST_COMMIT}" \
            --build-arg PGBACKREST_VERSION="${PGBACKREST_VERSION}" \
            -t "${IMAGE_TAG}" \
            --push \
            -f docker/pgbackrest-pkg/Dockerfile \
            .

          echo "Pushed: ${IMAGE_TAG}"

  build-arm64:
    runs-on:
      group: arm-runners
    env:
      ARCH: arm64
      PGBACKREST_COMMIT: ${{ inputs.pgbackrest_commit }}
      PGBACKREST_VERSION: ${{ inputs.pgbackrest_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push package image
        run: |
          # arm64 base variant
          CNPG_BASE_ARM="ghcr.io/cloudnative-pg/postgresql:17-minimal-bookworm"
          IMAGE_TAG="${REGISTRY}/${PACKAGE_NAME}:${PGBACKREST_VERSION}-${ARCH}"

          echo "Building pgBackRest package using base: ${CNPG_BASE_ARM}"
          echo "Commit: ${PGBACKREST_COMMIT}"
          echo "Image tag: ${IMAGE_TAG}"

          docker buildx build \
            --platform linux/arm64 \
            --build-arg CNPG_BASE="${CNPG_BASE_ARM}" \
            --build-arg PGBACKREST_COMMIT="${PGBACKREST_COMMIT}" \
            --build-arg PGBACKREST_VERSION="${PGBACKREST_VERSION}" \
            -t "${IMAGE_TAG}" \
            --push \
            -f docker/pgbackrest-pkg/Dockerfile \
            .

          echo "Pushed: ${IMAGE_TAG}"

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    env:
      PGBACKREST_VERSION: ${{ inputs.pgbackrest_version }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          BASE_TAG="${REGISTRY}/${PACKAGE_NAME}:${PGBACKREST_VERSION}"
          AMD64_TAG="${BASE_TAG}-amd64"
          ARM64_TAG="${BASE_TAG}-arm64"

          echo "Creating multi-arch manifest: ${BASE_TAG}"
          echo "  - ${AMD64_TAG}"
          echo "  - ${ARM64_TAG}"

          docker buildx imagetools create \
            -t "${BASE_TAG}" \
            "${AMD64_TAG}" \
            "${ARM64_TAG}"

          echo "Pushed multi-arch manifest: ${BASE_TAG}"
